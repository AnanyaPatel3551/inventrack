name: InvenTrack CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase, so the owner is written out here
  IMAGE_PREFIX: ghcr.io/ananyapatel3551
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}/inventrack-backend:${{ github.sha }} ./backend
          docker build -t ${{ env.IMAGE_PREFIX }}/inventrack-frontend:${{ github.sha }} ./frontend
      - name: Scan backend
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/inventrack-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/inventrack-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push images
        run: |
          docker push ${{ env.IMAGE_PREFIX }}/inventrack-backend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}/inventrack-frontend:${{ github.sha }}
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        env: {KUBE_CONFIG_DATA: '${{ secrets.KUBE_CONFIG_DATA }}'}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: Deploy with Helm
        run: |
          helm upgrade --install inventrack ./helm/inventrack -n inventrack --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=${{ env.IMAGE_PREFIX }}/inventrack-backend \
            --set frontend.image=${{ env.IMAGE_PREFIX }}/inventrack-frontend
