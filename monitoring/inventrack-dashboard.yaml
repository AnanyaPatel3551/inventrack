# Grafana dashboard for the InvenTrack backend.
# The Grafana sidecar from kube-prometheus-stack loads any ConfigMap labelled grafana_dashboard: "1".
#
#   kubectl apply -f monitoring/inventrack-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventrack-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: inventrack
  annotations:
    grafana_folder: InvenTrack
data:
  inventrack-dashboard.json: |-
    {
      "uid": "inventrack-overview",
      "title": "InvenTrack - Backend Overview",
      "tags": ["inventrack", "fastapi"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" }
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": { "query": "label_values(http_requests_total, namespace)", "refId": "ns" },
            "definition": "label_values(http_requests_total, namespace)",
            "current": { "text": "inventrack", "value": "inventrack" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate (req/s) by endpoint",
          "description": "HTTP requests per second handled by the FastAPI backend, split by route.",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (handler) (rate(http_requests_total{namespace=\"$namespace\", handler!=\"/metrics\"}[$__rate_interval]))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency by endpoint",
          "description": "95th percentile request duration from the http_request_duration_seconds histogram.",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", handler!=\"/metrics\"}[$__rate_interval])))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "5xx error rate",
          "description": "Server errors per second, and the share of all requests that returned 5xx.",
          "gridPos": { "x": 0, "y": 9, "w": 12, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "min": 0, "color": { "mode": "fixed", "fixedColor": "red" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "5xx share" },
                "properties": [
                  { "id": "unit", "value": "percentunit" },
                  { "id": "custom.axisPlacement", "value": "right" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }
                ]
              }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", status=\"5xx\"}[$__rate_interval])) or vector(0)",
              "legendFormat": "5xx req/s"
            },
            {
              "refId": "B",
              "expr": "(sum(rate(http_requests_total{namespace=\"$namespace\", status=\"5xx\"}[$__rate_interval])) or vector(0)) / sum(rate(http_requests_total{namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "5xx share"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pod count (available replicas)",
          "description": "Available pods per deployment, plus the replica count the backend HPA is asking for.",
          "gridPos": { "x": 12, "y": 9, "w": 12, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "decimals": 0, "custom": { "lineInterpolation": "stepAfter" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (deployment) (kube_deployment_status_replicas_available{namespace=\"$namespace\"})",
              "legendFormat": "{{deployment}}"
            },
            {
              "refId": "B",
              "expr": "sum by (horizontalpodautoscaler) (kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"$namespace\"})",
              "legendFormat": "HPA desired ({{horizontalpodautoscaler}})"
            }
          ]
        }
      ]
    }
