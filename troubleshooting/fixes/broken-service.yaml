# Fix for scenario 2 - broken service
#
# Cause: the Service selector (app: inventrack-lab-website) does not match the pod
# label (app: inventrack-lab-web). A Service only routes to pods whose labels match
# its selector, so the Endpoints list is empty (<none>) even though the pods are healthy.
#
# Fix: make the selector match the pod label. Endpoints fill in within seconds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventrack-lab-service
  namespace: inventrack
  labels:
    app: inventrack-lab-web
    scenario: broken-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventrack-lab-web
  template:
    metadata:
      labels:
        app: inventrack-lab-web
        scenario: broken-service
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventrack-lab-service
  namespace: inventrack
  labels:
    scenario: broken-service
spec:
  selector:
    app: inventrack-lab-web
  ports:
    - name: http
      port: 80
      targetPort: http
