# Scenario 2 - broken service
#
# Symptom: the pods are Running and Ready, but the Service sends traffic nowhere.
# Investigate:
#   kubectl get pods,endpoints -n inventrack -l scenario=broken-service --show-labels
#   kubectl describe service inventrack-lab-service -n inventrack
#   kubectl get pods -n inventrack --show-labels
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventrack-lab-service
  namespace: inventrack
  labels:
    app: inventrack-lab-web
    scenario: broken-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventrack-lab-web
  template:
    metadata:
      labels:
        app: inventrack-lab-web
        scenario: broken-service
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventrack-lab-service
  namespace: inventrack
  labels:
    scenario: broken-service
spec:
  selector:
    app: inventrack-lab-website
  ports:
    - name: http
      port: 80
      targetPort: http
