# Scenario 3 - broken readiness probe
#
# Symptom: the pods are Running but never become Ready (READY 0/1), and the Service has no endpoints.
# Investigate:
#   kubectl get pods,endpoints -n inventrack -l scenario=broken-readiness
#   kubectl describe pod -n inventrack -l scenario=broken-readiness
#   kubectl get endpointslices -n inventrack -l kubernetes.io/service-name=inventrack-lab-readiness -o wide
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventrack-lab-readiness
  namespace: inventrack
  labels:
    app: inventrack-lab-readiness
    scenario: broken-readiness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventrack-lab-readiness
  template:
    metadata:
      labels:
        app: inventrack-lab-readiness
        scenario: broken-readiness
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventrack-lab-readiness
  namespace: inventrack
  labels:
    scenario: broken-readiness
spec:
  selector:
    app: inventrack-lab-readiness
  ports:
    - name: http
      port: 80
      targetPort: http
