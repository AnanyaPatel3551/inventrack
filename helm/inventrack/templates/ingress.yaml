{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "inventrack.fullname" . }}
  labels:
    {{- include "inventrack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # FastAPI serves its routes under /api, so the path is passed through unchanged
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "inventrack.backendName" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "inventrack.frontendName" . }}
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
