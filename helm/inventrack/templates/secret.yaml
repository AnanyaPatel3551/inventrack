apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inventrack.dbSecretName" . }}
  labels:
    {{- include "inventrack.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" (.Values.postgres.username | urlquery) (.Values.postgres.password | urlquery) (include "inventrack.postgresName" .) .Values.postgres.database | quote }}
