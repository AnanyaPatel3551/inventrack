apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventrack.postgresName" . }}
  labels:
    {{- include "inventrack.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "inventrack.selectorLabels" (dict "ctx" . "component" "database") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventrack.postgresName" . }}
  labels:
    {{- include "inventrack.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  replicas: 1
  # The ReadWriteOnce volume can only be mounted by one pod, so stop the old pod before starting a new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "inventrack.selectorLabels" (dict "ctx" . "component" "database") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inventrack.componentLabels" (dict "ctx" . "component" "database") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "inventrack.dbSecretName" . }}
          env:
            # Use a sub-folder so Postgres does not complain about lost+found on the volume root
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "inventrack.postgresName" . }}-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "inventrack.postgresName" . }}-data
  labels:
    {{- include "inventrack.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
