apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventrack.backendName" . }}
  labels:
    {{- include "inventrack.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "inventrack.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
