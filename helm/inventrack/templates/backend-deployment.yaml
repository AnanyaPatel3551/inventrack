apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventrack.backendName" . }}
  labels:
    {{- include "inventrack.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  {{- /* When the HPA is on it owns the replica count (minReplicas), so Helm must not reset it */}}
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inventrack.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inventrack.componentLabels" (dict "ctx" . "component" "backend") | nindent 8 }}
      annotations:
        # Restart the pods when the database secret changes
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "inventrack.dbSecretName" . }}
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
